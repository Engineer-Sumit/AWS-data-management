<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Management System</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f5f7fb;
    }

    .header {
        background: #0056d6;
        padding: 18px;
        text-align: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
    }

    .card {
        background: white;
        width: 90%;
        max-width: 780px;
        margin: 30px auto;
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }

    h2 {
        margin-top: 0px;
        color: #0056d6;
    }

    label {
        font-weight: bold;
        margin-top: 8px;
        display: block;
    }

    input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin-bottom: 12px;
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #0056d6;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        margin-top: 12px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background: #003c9c;
    }

    #searchBar {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    #loading {
        display: none;
        text-align: center;
        font-size: 18px;
        padding: 10px;
    }

    .alert-success {
        background: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 6px;
        margin-top: 10px;
    }

    .alert-error {
        background: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 6px;
        margin-top: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

#studentTable th,
#studentTable td {
    padding: 12px 16px;
    text-align: left;
    vertical-align: middle;
}

#studentTable th {
    background: #0056d6;
    color: white;
    cursor: pointer;
}

#studentTable td {
    background: #f9f9f9;
    border-bottom: 1px solid #ddd;
}

#studentTable tbody tr:hover td {
    background: #e8f0ff;
}

#studentTable tbody tr td {
    transition: background 0.2s ease;
}

.action-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    display: inline-block;
    transition: 0.2s ease-in-out;
}

/* EDIT BUTTON */
.action-edit {
    background: #0d6efd;
}
.action-edit:hover {
    background: #0a58ca;
}

/* DELETE BUTTON */
.action-delete {
    background: #dc3545;
}
.action-delete:hover {
    background: #bb2d3b;
}

    .footer {
        text-align: center;
        font-size: 14px;
        color: #777;
        margin-top: 20px;
        padding: 10px;
    }
    
    a {
        color: #777;
        text-decoration: none;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="header">STUDENT MANAGEMENT SYSTEM</div>

<div class="card">

    <h2>Add Student</h2>

    <input type="text" id="studentid" placeholder="Student ID">
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="class" placeholder="Class">
    <input type="text" id="age" placeholder="Age">

    <input type="submit" id="savestudent" value="Save">

    <p id="studentSaved"></p>

    <hr>

    <h2>All Students</h2>

    <input type="text" id="searchBar" placeholder="Search by ID or Name">

    <input type="submit" id="getstudents" value="Load Students">

    <div id="loading">⏳ Loading...</div>

    <table id="studentTable">
        <thead>
            <tr>
                <th data-col="studentid">Student ID</th>
                <th data-col="name">Name</th>
                <th data-col="class">Class</th>
                <th data-col="age">Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<div class="footer">© 2025 Student Data Management | AWS Serverless Architecture | Build With 💙 by <a href="https://github.com/Engineer-Sumit/Student-Data-Management-AWS-Serverless-Architecture">Engineer Sumit</a></div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="scripts.js"></script>

</body>
</html>
